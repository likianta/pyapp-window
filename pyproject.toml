[project]
name = "pyapp-window"
version = "2.2.4b0"
description = "Launching URL with native window in WebView mode."
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argsense>=1.1.2",
    "lk-utils>=3.8.2a20",
    "pywebview>=6.1.0; sys_platform == 'linux' and python_version >= '3.9' and python_version < '3.15'",
    "requests>=2.32.4; python_version >= '3.8' and python_version < '3.9'",
    "requests>=2.32.5; python_version >= '3.9'",
    "toga<0.4.7; sys_platform != 'linux' and python_version >= '3.8' and python_version < '3.9'",
    "toga>=0.5.0,<0.5.3; sys_platform != 'linux' and python_version >= '3.9' and python_version < '3.10'",
    "toga>=0.5.3; sys_platform != 'linux' and python_version >= '3.10' and python_version < '3.15'",
    
    # -- toga dependencies
    # "cffi>=1.17.1; sys_platform == 'win32'",
    # pygobject = [
    #     { version = "<3.50.0", platform = "!=linux", python = "<3.9" },
    #     { version = "^3.50.0", platform = "!=linux", python = ">=3.9,<4.0" },
    # ]
    "pythonnet>=3.0.5; sys_platform == 'win32' and python_version >= '3.8' and python_version < '3.14'",
    "pythonnet>=3.1.0rc0; sys_platform == 'win32' and python_version >= '3.14' and python_version < '3.15'",
    # toga-core = [
    #     { version = "^0.5.3", platform = "win32", python = ">=3.10,<3.15" },
    #     { version = ">=0.5.0,<0.5.3", platform = "win32", python = ">=3.9,<3.10" },
    #     { version = ">=0.4.6,<0.5.0", platform = "win32", python = ">=3.8,<3.9" },
    # ]
    # toga-winforms = [
    #     { version = "^0.5.3", platform = "win32", python = ">=3.10,<3.15" },
    #     { version = ">=0.5.0,<0.5.3", platform = "win32", python = ">=3.9,<3.10" },
    #     { version = ">=0.4.6,<0.5.0", platform = "win32", python = ">=3.8,<3.9" },
    # ]
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "pythonnet>=3.0.5; python_version >= '3.9' and python_version < '3.14'",
    "pythonnet>=3.1.0rc0; python_version >= '3.14' and python_version < '3.15'",
    "pywebview>=6.1.0; python_version >= '3.12' and python_version < '3.15'",
    "toga>=0.5.3; python_version >= '3.12' and python_version < '3.15'",
    "webui2>=2.5.7",
    # "wxpython>=4.2.5; python_version >= '3.10' and python_version < '3.15'",
]

# [project.optional-dependencies]
# ...

# [project.scripts]
# ...

[project.urls]
homepage = "https://github.com/likianta/pyapp-window"

[tool.hatch.build.targets.wheel]
packages = ["pyapp_window"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

# [tool.ruff.lint]
# extend-select = ["E501"]  # line too long
# extend-select = ["I001", "E501"]

[tool.ruff.lint.isort]
force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pycodestyle]
max-line-length = 83

# [tool.ty.environment]
# extra-paths = ["./lib"]

# [tool.ty.rules]
# invalid-type-form = "ignore"
# unresolved-attribute = "ignore"

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2131/"
# explicit = true

[tool.uv.sources]
# argsense = { index = "likianta" }
lk-utils = { index = "likianta" }
